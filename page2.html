<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page 2</title>
<style>body{font-family:-apple-system,sans-serif;margin:0;background:#f5f5f7}.card{max-width:480px;margin:30px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}label{font-weight:600;display:block;margin-top:15px}input,select{width:100%;padding:14px;margin-top:6px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}button{width:100%;padding:15px;background:#111;color:white;border:none;border-radius:12px;font-size:17px;font-weight:700;margin-top:22px}</style>
</head>
<body>
<div class="card">
<h2>Final Details</h2>
<div id="preview" style="background:#f0f0f5;padding:12px;border-radius:10px;font-size:14px;margin-bottom:15px"></div>
<label>👤 Your first name</label><input id="firstName" placeholder="e.g. Samuel">
<label>🏫 School name</label><input id="schoolName" placeholder="e.g. Accra Academy">
<label>📚 Class</label><input id="className" placeholder="e.g. SHS 2A">
<label>🌍 Country / Team</label>
<select id="country"><option value="">Select country jersey</option><option>Ghana</option><option>Nigeria</option><option>Brazil</option><option>Argentina</option><option>Portugal</option><option>England</option><option>France</option><option>Real Madrid</option><option>Barcelona</option><option>Man City</option><option>Arsenal</option><option>Other</option></select>
<button onclick="submitAll()">Continue → Submit</button>
</div>
<script>
document.getElementById('preview').innerText= "Jersey:" + localStorage.getItem('jerseyName')+" #" +localStorage.getItem('jerseyNumber') + " - " + localStorage.getItem('jerseySize');


async function submitAll(){
 const fn=document.getElementById('firstName').value.trim(); const sc=document.getElementById('schoolName').value.trim(); const cl=document.getElementById('className').value.trim(); const co=document.getElementById('country').value;
 if(!fn||!sc||!cl||!co){alert('Fill all');return;}

var text = "NEW JERSEY ORDER: Page1: Name on Jersey: " + localStorage.getItem('jerseyName') + " Number: " + localStorage.getItem('jerseyNumber') + " Size: " + localStorage.getItem('jerseySize') + " Page2: First Name: " + fn + " School: " + sc + " Class: " + cl + " Country/Team: " + co;


try{
  await fetch("/.netlify/functions/sendOrder", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({text: text})
  });
}catch(e){}


localStorage.setItem('orderText',text);
location.href='thankyou.html';

}
</script>
</body>
</html>
