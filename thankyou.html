<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Received</title>
<style>body{font-family:sans-serif;background:#f5f5f7;display:flex;justify-content:center;padding:30px}.card{background:white;max-width:480px;width:100%;padding:30px;border-radius:18px;text-align:center}button{width:100%;padding:15px;background:#111;color:white;border:none;border-radius:12px;margin-top:20px;font-weight:700}</style>
</head>
<body>
<div class="card">
<h1>✅ Order Received!</h1>
<div id="orderDetails" style="background:#f0f0f0;padding:15px;border-radius:10px;text-align:left;margin:20px 0;font-size:14px"></div>
<p>Kevin will contact you soon.</p>
<p style="color:#666;font-size:13px">Redirecting to shop...</p>
<button onclick="goShop()">Go to Shop Now →</button>
</div>
<script>
var order = localStorage.getItem('orderText');
document.getElementById('orderDetails').innerText = order ? order : "Order saved";

// PUT YOUR SHOPIFY LINK HERE
var SHOPIFY_URL = "https://your-store.myshopify.com";

function goShop(){
 window.location.href = SHOPIFY_URL;
}
// Auto redirect after 4 seconds
setTimeout(goShop, 4000);
</script>
</body>
</html>
